name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Required env vars for typecheck + build. Use placeholders so the build
  # passes — real credentials live in Vercel env settings.
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: price_ci_placeholder
  CRON_SECRET: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
